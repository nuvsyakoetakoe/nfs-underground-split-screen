name: Bug report / Ошибка
description: Report a problem with the mod / Сообщить об ошибке мода
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Mod and Windows versions / Версии мода и Windows
      placeholder: "v1.0.0, Windows 11"
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: Game and other mods / Игра и другие моды
      description: Game version, language and other installed mods / Версия и язык игры, другие установленные моды.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and result / Шаги и результат
      description: Race mode, track, steps, expected and actual result / Режим, трасса, шаги, ожидаемый и фактический результат.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Display and input / Экран и управление
      description: Resolution, devices and player assignments / Разрешение, устройства и их назначение игрокам.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and video / Скриншоты и видео
      description: Attach a screenshot or video if possible / По возможности приложи скриншот или видео.
